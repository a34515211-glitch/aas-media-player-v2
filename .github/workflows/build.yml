name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: |
          PROJ_DIR=$(find . -maxdepth 5 -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1 | xargs -r dirname)
          echo "Found project dir: ${PROJ_DIR:-.}"
          cd "${PROJ_DIR:-.}"
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AAS-Media-Player-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
